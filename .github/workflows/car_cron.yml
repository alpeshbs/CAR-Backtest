name: Check Telegram & Backtest

on:
  schedule:
    # દર ૨૦ મિનિટે આપમેળે ચાલશે (તમારે કંઈ જ દબાવવું નહીં પડે)
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Offset
        uses: actions/cache@v3
        with:
          path: last_offset.txt
          key: telegram-offset-${{ github.run_id }}
          restore-keys: |
            telegram-offset-

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Script
        run: python car_queue_bot.py
        
